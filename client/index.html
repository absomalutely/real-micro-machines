<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Micro Machines</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        color: #e0e0e0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 1.5rem;
        z-index: 10;
        pointer-events: none;
      }
      #info {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-size: 0.85rem;
        opacity: 0.7;
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loading">Loading map...</div>
      <div id="info"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
